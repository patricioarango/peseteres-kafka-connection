**One important production consideration:** the single-node configuration above is suitable for learning and initial testing, not high availability. For a critical production deployment, use multiple brokers and a properly isolated KRaft controller quorum. A combined broker/controller node is not recommended for critical deployments. <Cite refs={["turn209660search7"]}/>

