
# KRaft
process.roles=broker,controller
node.id=1
controller.quorum.voters=1@kafka:9094

# Listeners
listeners=INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:9093,CONTROLLER://0.0.0.0:9094

advertised.listeners=INTERNAL://kafka:9092,EXTERNAL://kafka.example.com:9093

listener.security.protocol.map=INTERNAL:SASL_SSL,EXTERNAL:SASL_SSL,CONTROLLER:PLAINTEXT

inter.broker.listener.name=INTERNAL
controller.listener.names=CONTROLLER

# SASL
sasl.enabled.mechanisms=SCRAM-SHA-512
sasl.mechanism.inter.broker.protocol=SCRAM-SHA-512

# TLS
ssl.keystore.type=PKCS12
ssl.keystore.location=/etc/kafka/secrets/kafka.keystore.p12
ssl.keystore.password=CHANGE_ME
ssl.key.password=CHANGE_ME

ssl.truststore.type=PKCS12
ssl.truststore.location=/etc/kafka/secrets/kafka.truststore.p12
ssl.truststore.password=CHANGE_ME

ssl.client.auth=none

# Authorization
authorizer.class.name=org.apache.kafka.metadata.authorizer.StandardAuthorizer
allow.everyone.if.no.acl.found=false

super.users=User:admin;User:broker

# Storage
log.dirs=/var/lib/kafka/data
```

Replace `kafka.example.com` with your real DNS name.

A few important details:

- `INTERNAL` is for Docker applications.
- `EXTERNAL` is for remote applications.
- `CONTROLLER` is private and not published.
- `CONTROLLER:PLAINTEXT` is only a simplified single-node example on an isolated network. For a production multi-node cluster, secure controller communication with TLS and mutual authentication.
- The certificate must include both `kafka` and `kafka.example.com` in its Subject Alternative Names (SAN).

Kafka supports independent security protocols per listener, which is what makes this architecture possible. <Cite refs={["turn211334search6","turn211334search0"]}/>

## 3. Create TLS certificates

You need a certificate for Kafka and a trusted CA certificate for clients.

For example, using OpenSSL:

```bash
# Create your own CA
openssl req -x509 -newkey rsa:4096 \
  -keyout ca.key \
  -out ca.crt \
  -days 3650 -nodes \
  -subj "/CN=Kafka-CA"
```

Then create a server certificate with these DNS names in its SAN:

```text
DNS:kafka
DNS:kafka.example.com
```

The two names are important:

- `kafka` is used by applications inside Docker.
- `kafka.example.com` is used by remote applications.

For production, protect the CA private key, use an established certificate management process, and renew certificates before expiration.

The broker needs its keystore and trusted CA. Clients need the CA certificate (or a truststore containing it). You can optionally require client certificates too, but SCRAM authentication is sufficient for the initial architecture.

## 4. Configure SCRAM users

You should have individual credentials for each application.

For example:

| Username | Purpose |
|---|---|
| admin | Kafka administration |
| broker | Broker-to-broker authentication |
| orders-api | Orders producer |
| billing-api | Billing consumer |
| reporting-api | Reporting consumer |

Kafka 4.x stores SCRAM credentials in the KRaft metadata log.

For initial credentials, use `kafka-storage.sh` during KRaft formatting:

```bash
kafka-storage.sh format \
  --standalone \
  -t YOUR_CLUSTER_UUID \
  -c /path/to/server.properties \
  --add-scram 'SCRAM-SHA-512=[name="admin",password="ADMIN_SECRET"]' \
  --add-scram 'SCRAM-SHA-512=[name="broker",password="BROKER_SECRET"]'
```

This is a one-time storage initialization for a new single-node cluster. Do not reformat an existing Kafka data volume.

For application users, once Kafka is running, create credentials dynamically:

```bash
kafka-configs.sh \
  --bootstrap-server kafka:9092 \
  --alter \
  --add-config 'SCRAM-SHA-512=[iterations=8192,password=ORDERS_SECRET]' \
  --entity-type users \
  --entity-name orders-api \
  --command-config admin.properties
```

The `admin.properties` file must itself use a secure authenticated connection.

See the <Link ref="turn209660search2" title="official SCRAM credential instructions"/>.

One configuration detail to include in `server.properties` is the broker's own inter-broker login:

```properties
sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required username="broker" password="BROKER_SECRET";
```

Keep that secret outside version control. In a real deployment, inject it through your secret-management mechanism rather than committing it to the properties file.

## 5. Configure ACL permissions

Now you can restrict each application.

For example, suppose `orders-api` can produce messages to `orders`:

```bash
kafka-acls.sh \
  --bootstrap-server kafka:9092 \
  --command-config admin.properties \
  --add \
  --allow-principal User:orders-api \
  --producer \
  --topic orders
```

For `billing-api`, which consumes from `orders`:

```bash
kafka-acls.sh \
  --bootstrap-server kafka:9092 \
  --command-config admin.properties \
  --add \
  --allow-principal User:billing-api \
  --consumer \
  --topic orders \
  --group billing-group
```

These commands create the necessary producer and consumer permissions, including the relevant topic and consumer-group operations.

Kafka's KRaft `StandardAuthorizer` provides default-deny authorization when no ACL matches. <Cite refs={["turn209660search0","turn209660search1"]}/>

## 6. Configure your applications

Every application needs its own connection properties.

For example, `orders-api.properties`:

```properties
bootstrap.servers=kafka.example.com:9093

security.protocol=SASL_SSL
sasl.mechanism=SCRAM-SHA-512

sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required \
  username="orders-api" \
  password="ORDERS_SECRET";

ssl.truststore.location=/certs/kafka.truststore.p12
ssl.truststore.password=TRUSTSTORE_SECRET
ssl.truststore.type=PKCS12
```

For an application running inside Docker, change only:

```properties
bootstrap.servers=kafka:9092
```

The rest of the security configuration remains the same.

This means your Python, Go, PHP or Java applications can all connect using the same security model.

## 7. Network and firewall rules

I would configure the infrastructure like this:

| Port | Purpose | Exposure |
|---|---|---|
| 9092 | Internal Kafka listener | Docker network only |
| 9093 | External Kafka listener | Firewall restricted |
| 9094 | KRaft controller | Private only |

For external access:

- Allow TCP 9093 only from authorized IP ranges where possible.
- Prefer VPN access for applications connecting from other company networks.
- Never expose 9094.
- Never expose Kafka management credentials to application containers.

Also remember that `advertised.listeners` is critical: Kafka returns broker addresses to clients after the initial connection. Those addresses must be accessible from the client's network. <Cite refs={["turn211334search6","turn211334search0"]}/>

